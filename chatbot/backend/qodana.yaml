version: "1.0"
linter: jetbrains/qodana-jvm-community:latest

project:
  modules:
    - name: backend
      path: chatbot/backend

bootstrap: |
  cd chatbot/backend
  ./gradlew clean build -x test

exclude:
  - name: All
    paths:
      - "chatbot/backend/src/test/**"
      - "chatbot/backend/build/**"
