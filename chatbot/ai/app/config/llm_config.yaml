active_preset: openai_only
presets:
  original:
    name: 원래 조합 (리팩토링 전)
    description: 리팩토링 전에 사용하던 All-OpenAI 조합 (기준점)
    roles:
      category:
        provider: openai
        model: gpt-4.1
      search_rewrite:
        provider: openai
        model: gpt-4o
      condense:
        provider: openai
        model: gpt-4.1
      gate:
        provider: openai
        model: gpt-4.1
      function_analyze:
        provider: openai
        model: o3-mini
  premium:
    name: 최고성능 조합
    description: 모든 교체 가능 부분을 OpenAI 프리미엄 모델로 설정하여 품질 극대화
    roles:
      category:
        provider: openai
        model: o3-mini
      search_rewrite:
        provider: openai
        model: gpt-4.1
      condense:
        provider: openai
        model: gpt-4.1
      gate:
        provider: openai
        model: o3-mini
      function_analyze:
        provider: openai
        model: o3-mini
  openai_only:
    name: OpenAI 전용 (속도 최적화)
    description: 모든 부분을 OpenAI mini/nano 모델로 설정 (속도 우선)
    roles:
      category:
        provider: openai
        model: gpt-4.1-mini
      search_rewrite:
        provider: openai
        model: gpt-4.1-mini
      condense:
        provider: openai
        model: gpt-4.1-mini
      gate:
        provider: openai
        model: gpt-4.1-mini
      function_analyze:
        provider: openai
        model: gpt-4.1-mini
  gpt5_nano_only:
    name: GPT-5 Nano 전용
    description: 모든 교체 가능 부분을 GPT-5 Nano로 설정 (최신 경량 모델)
    roles:
      category:
        provider: openai
        model: gpt-5-nano
      search_rewrite:
        provider: openai
        model: gpt-5-nano
      condense:
        provider: openai
        model: gpt-5-nano
      gate:
        provider: openai
        model: gpt-5-nano
      function_analyze:
        provider: openai
        model: o3-mini
fixed_roles:
  function_calling:
    provider: openai
    model: gpt-4.1-mini
    reason: OpenAI Responses API의 tool calling 기능 종속 (속도 최적화로 mini 사용)
  web_search:
    provider: claude
    model: claude-sonnet-5-5
    reason: Claude web_search/web_fetch 도구로 www.halla.ac.kr 안에서만 검색 (allowed_domains로 강제)
  streaming:
    provider: openai
    model: gpt-4.1-mini
    reason: 스트리밍 응답 파싱 로직이 OpenAI API에 종속 (속도 최적화로 mini 사용)
  search_verify_openai:
    provider: openai
    model: gpt-4.1-mini
    reason: 웹 검색 결과 검증. 검색(Claude)과 다른 모델 계열로 고정해 한쪽 모델의 환각/오판을 잡아냄
role_descriptions:
  category: 공지 카테고리 분류 (학사공지/비교과공지/장학공지/일반공지/해당없음)
  search_rewrite: 검색어 재작성 (사용자 질문 + 문맥 → 최적화된 검색어)
  condense: RAG 컨텍스트 요약 (긴 문서 → 질문에 맞게 요약)
  gate: RAG 게이트 판정 (규정 질문 여부 판단 + JSON 스키마 출력)
  function_analyze: 함수 선택 추론 (LLM이 함수를 선택한 이유 생성 + JSON 스키마 출력)
  function_calling: 함수 호출 판단 및 실행 (OpenAI 전용)
  web_search: 웹 검색 실행 (Claude web_search/web_fetch, www.halla.ac.kr 한정)
  streaming: 스트리밍 응답 생성 (OpenAI 전용)
  search_verify_openai: 웹 검색 결과 검증 (OpenAI 전용)
provider_config:
  openai:
    message_overhead: 3
    reply_priming_overhead: 3
    name_field_overhead: 1

# 토큰 추적 설정
token_tracking:
  # 토큰 계산 모드
  # - api_first: OpenAI API usage 우선 사용, 없으면 tiktoken 폴백 (권장, 가장 정확)
  # - tiktoken_only: tiktoken 기반 예측만 사용 (기존 방식)
  # - hybrid: API usage와 tiktoken 예측을 모두 추적하여 비교 (디버깅용)
  mode: api_first

  # tiktoken으로 폴백 여부 (api_first 모드에서만 유효)
  fallback_to_tiktoken: true

  # reasoning tokens 추적 여부 (o3-mini 등 추론 모델의 사고 토큰)
  track_reasoning_tokens: true
