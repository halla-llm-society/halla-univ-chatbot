# LLM API 가격표 (2025년 10월 기준 정정)
# OpenAI + Anthropic Claude 모델 포함
# 단위: USD per 1M tokens
# 출처: OpenAI 공식 문서 (platform.openai.com), Anthropic 공식 문서 (docs.anthropic.com)

models:
  # ===== OpenAI 모델 =====
  - id: gpt-4.1
    provider: openai
    input_per_1m_tokens_usd: 2.00
    output_per_1m_tokens_usd: 8.00
    cache_input_per_1m_tokens_usd: 0.50  # 캐시 입력 75% 할인
    currency: USD
    note: "캐시 입력 시 75% 할인 적용"
    
  - id: o3-mini
    provider: openai
    input_per_1m_tokens_usd: 1.10
    output_per_1m_tokens_usd: 4.40
    cache_input_per_1m_tokens_usd: 0.55
    currency: USD
    note: "캐시 입력 지원"
    
  - id: gpt-4o
    provider: openai
    input_per_1m_tokens_usd: 2.50
    output_per_1m_tokens_usd: 10.00
    cache_input_per_1m_tokens_usd: 1.25
    currency: USD
    note: "Omni 모델, 캐시 입력 지원"
    
  
  # OpenAI nano 모델들 (경량)
  - id: gpt-5-nano
    provider: openai
    input_per_1m_tokens_usd: 0.05
    output_per_1m_tokens_usd: 0.40  # 정정: $0.005 → $0.40
    cache_input_per_1m_tokens_usd: 0.005
    currency: USD
    note: "최신 경량 모델, 캐시 입력 지원"
  
  - id: gpt-4.1-mini
    provider: openai
    input_per_1m_tokens_usd: 0.40
    output_per_1m_tokens_usd: 1.60
    cache_input_per_1m_tokens_usd: 0.10
    currency: USD
    note: "미니 모델, 캐시 입력 지원"
  
  - id: gpt-4.1-nano
    provider: openai
    input_per_1m_tokens_usd: 0.10
    output_per_1m_tokens_usd: 0.40  # 정정: $0.025 → $0.40
    cache_input_per_1m_tokens_usd: 0.025
    currency: USD
    note: "나노 모델, 캐시 입력 지원"
  
  # OpenAI 임베딩 모델
  - id: text-embedding-3-small
    provider: openai
    input_per_1m_tokens_usd: 0.02
    output_per_1m_tokens_usd: 0.0  # 임베딩 모델은 출력 없음
    currency: USD
    note: "임베딩 모델, 출력 없음"
  
  # ===== Anthropic Claude 모델 =====
  # 출처: Anthropic 공식 문서 (docs.anthropic.com)

  - id: claude-sonnet-5-5
    provider: claude
    input_per_1m_tokens_usd: 2.00
    output_per_1m_tokens_usd: 10.00
    cache_input_per_1m_tokens_usd: 0.20
    currency: USD
    note: "웹 검색(web_search/web_fetch)용. 검색 횟수당 요금은 토큰 요금과 별도로 청구됨"

  - id: claude-haiku-4-5
    provider: claude
    input_per_1m_tokens_usd: 1.00
    output_per_1m_tokens_usd: 5.00
    currency: USD
    note: "현재 미사용 (예전 웹 검색 2차 검증용)"

  - id: claude-sonnet-5
    provider: claude
    input_per_1m_tokens_usd: 2.00
    output_per_1m_tokens_usd: 10.00
    currency: USD
    note: "필요 시 더 고품질 검증/생성용으로 교체 가능"

# 폴백 기본값 (미등록 모델)
default:
  provider: unknown
  input_per_1m_tokens_usd: 2.50
  output_per_1m_tokens_usd: 10.00
  currency: USD
